<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AF — كتالوج المستودعات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root{
  --gold:#c9a84c;--dark:#111827;--card:#1f2937;
  --border:rgba(201,168,76,0.18);--text:#f1f5f9;--muted:#64748b;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{background:linear-gradient(180deg,#1e3a5f,#111827);border-bottom:2px solid var(--gold);padding:12px 16px;flex-shrink:0;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.h-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{font-size:20px;font-weight:900;color:var(--gold);letter-spacing:3px}
.logo em{color:#fff;font-style:normal;font-weight:400;font-size:13px;margin-right:4px}
.pills{display:flex;gap:6px;margin-right:auto}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.p1{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.p2{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid var(--border)}
.p3{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.sw{position:relative}
.si{width:100%;padding:11px 44px 11px 14px;background:#0f172a;border:1.5px solid var(--border);border-radius:10px;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.si:focus{border-color:var(--gold)}
.si::placeholder{color:var(--muted)}
.sic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}
.sc{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;display:none;line-height:1;padding:0}

.filters{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:rgba(15,23,42,.5);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fb.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}

.rbar{padding:7px 16px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px}
.rbar strong{color:var(--gold)}
.sort-btn{margin-right:auto;background:none;border:1px solid var(--border);color:var(--muted);font-family:'Cairo',sans-serif;font-size:11px;padding:3px 10px;border-radius:6px;cursor:pointer;transition:color .2s}

.gw{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:active{transform:scale(.97)}
.card.hi{border-color:var(--gold);box-shadow:0 4px 20px rgba(201,168,76,.15)}
.iw{position:relative;aspect-ratio:1;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a)}
.ci{width:100%;height:100%;object-fit:cover}
.ni{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(255,255,255,.08)}
.wb{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.w1b{background:rgba(59,130,246,.85);color:#fff}
.w2b{background:rgba(201,168,76,.85);color:#111}
.w3b{background:rgba(34,197,94,.85);color:#111}
.cb{padding:8px 10px 10px}
.pkg{display:inline-block;background:rgba(201,168,76,.12);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;margin-bottom:5px}
.cn{font-size:12px;font-weight:600;line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Box quantity display on card */
.qty-row{display:flex;align-items:stretch;gap:6px;margin-bottom:0}
.qty-box{flex:1;background:rgba(0,0,0,.2);border-radius:7px;padding:5px 7px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.qty-label{font-size:9px;color:var(--muted);display:block;margin-bottom:1px}
.qty-val{font-size:14px;font-weight:700;display:block;line-height:1.2}
.qty-unit{font-size:9px;font-weight:400}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#1e293b;border:1px solid var(--gold);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px;animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mcl{float:left;background:rgba(255,255,255,.08);border:none;color:var(--muted);font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mimg{width:100%;border-radius:12px;margin:12px 0;display:none}
.mcode{display:inline-block;background:rgba(201,168,76,.15);color:var(--gold);font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;margin:8px 0 4px}
.mname{font-size:17px;font-weight:700;line-height:1.4;margin-bottom:16px}

/* Modal qty grid - hero display */
.mqty{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mqty-main{grid-column:1/-1;background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:16px;text-align:center}
.mqty-main .big{font-size:36px;font-weight:900;line-height:1}
.mqty-main .unit{font-size:13px;color:var(--muted);margin-top:4px}
.mqty-sub{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.mqty-sub .num{font-size:20px;font-weight:700;color:var(--gold)}
.mqty-sub .lbl{font-size:11px;color:var(--muted);margin-top:2px}

.mdetails{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi2{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ml{font-size:10px;color:var(--muted);margin-bottom:3px}
.mv{font-size:14px;font-weight:700;color:var(--gold)}
.mfull{grid-column:1/-1}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.lmw{grid-column:1/-1;text-align:center;padding:16px 0 24px}
.lmb{background:var(--gold);color:#111;border:none;padding:12px 36px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer}

/* ===== added: edit / add-image / add-product / export ===== */
.addimg-btn{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,.68);color:#fff;border:1px dashed rgba(255,255,255,.4);border-radius:7px;font-size:10px;padding:5px 2px;cursor:pointer;font-family:'Cairo',sans-serif}
.addimg-btn:hover{background:rgba(0,0,0,.85);border-color:var(--gold);color:var(--gold)}

.fab-bar{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:10px;z-index:250}
.fab{width:52px;height:52px;border-radius:50%;border:none;font-size:21px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.fab.add{background:var(--gold);color:#111}
.fab.exp{background:#1e293b;color:var(--gold);border:1.5px solid var(--gold)}

.medit{float:left;margin-left:8px;background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:'Cairo',sans-serif}

.fmodal{background:#1e293b;border:1px solid var(--gold);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;margin:5vh auto;animation:up .28s ease}
.ftitle{font-size:16px;font-weight:700;color:var(--gold);margin-bottom:14px}
.frow{margin-bottom:10px}
.frow label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.frow input,.frow select{width:100%;padding:9px 10px;background:#0f172a;border:1.5px solid var(--border);border-radius:8px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;outline:none}
.frow input:focus,.frow select:focus{border-color:var(--gold)}
</style>

// Initialize app: load products from server and render
async function initializeApp(){
  await loadProductsFromServer();
  run();
}
initializeApp();
bindGridEvents();

<script>
// ملاحظة أمنية: هذا الملف يعمل كـ HTML محلي بدون auth أو صلاحيات منفصلة.
// أي شخص يفتح الملف في المتصفح لديه صلاحية كاملة للتعديل/الحذف/التصدير/إضافة أصناف.
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Images are stored on the server. Client sends data-URLs to backend and
// uses returned `image_url` (e.g. `images/xxx.png`) for display.
let DATA = [];
let filtered=[], curF='all', curQ='', sortByBoxes=false, page=0;
const PAGE=50;
let curCode=null;
let curItemKey=null;

async function loadProductsFromServer(){
  try {
    const res = await fetch('/api/products');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (Array.isArray(rows) && rows.length) {
      DATA = rows.map(p => ({ ...p, image_url: normalizeRelativeImagePath(p.image_url || '') }));
    } else {
      DATA = [];
    }
  } catch (err) {
    console.warn('فشل تحميل البيانات من الخادم:', err);
    DATA = [];
  }
}

function normalizeKeyPart(v){return String(v||'').trim().toLowerCase();}
function buildItemKey(p){
  return [p.warehouse, p.code, p.package_code, p.barcode]
    .map(normalizeKeyPart)
    .join('|');
}
function safeImageNamePart(v) {
  if (!v || v === 'null' || v === '-') return '';
  return String(v)
    .trim()
    .normalize('NFKD')
    .replace(/[␀-]/g, '')
    .replace(/[^a-zA-Z0-9\-_]+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    .toLowerCase();
}

function normalizeRelativeImagePath(src) {
  if (!src) return '';
  const s = String(src).trim();
  if (!s) return '';
  if (s.startsWith('data:image/') || s.startsWith('http://') || s.startsWith('https://')) return s;
  const normalized = s.replace(/\\/g, '/');
  if (normalized.startsWith('./images/')) return normalized.replace(/^\.\//, '');
  if (normalized.startsWith('images/')) return normalized;
  if (normalized.startsWith('/')) {
    const fileName = normalized.split('/').filter(Boolean).pop() || '';
    return fileName ? `images/${fileName}` : '';
  }
  if (/^[a-zA-Z]:\//.test(normalized) || normalized.startsWith('file://')) {
    const fileName = normalized.split('/').filter(Boolean).pop() || '';
    return fileName ? `images/${fileName}` : '';
  }
  if (/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(normalized.split('?')[0].split('#')[0])) {
    return `images/${normalized.split('/').pop()}`;
  }
  return normalized;
}

function isValidImageSource(src) {
  if (!src) return false;
  const s = String(src).trim();
  if (s.startsWith('data:image/')) {
    return /^data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/i.test(s);
  }
  return s.startsWith('images/') || s.startsWith('./images/') || s.startsWith('http://') || s.startsWith('https://');
}

function buildImageFileName(p) {
  if (!p) return 'item';
  const code = safeImageNamePart(p.code);
  const pkg = safeImageNamePart(p.package_code);

  if (pkg && pkg !== '-' && pkg !== 'null' && code) {
    return `${pkg}_${code}`;
  }
  return code || pkg || 'item';
}

function getImageDisplayUrl(item) {
  if (!item) return null;
  const imageUrl = String(item.image_url || '').trim();
  if (!imageUrl) return null;
  // Accept data URLs or server-hosted image paths (images/...) or full URLs
  if (imageUrl.startsWith('data:image/')) return imageUrl;
  if (isValidImageSource(imageUrl)) return imageUrl;
  return null;
}

function getImg(p) {
  if (!p) return null;
  const direct = getImageDisplayUrl(p);
  if (direct) return direct;
  // Fallback to server-side filename convention
  const baseName = buildImageFileName(p);
  if (baseName && baseName !== 'item') return `images/${baseName}.png`;
  const cleanCode = safeImageNamePart(p.code);
  if (cleanCode) return `images/${cleanCode}.png`;
  return null;
}

function hasImage(p) { return !!getImg(p); }

function findByKey(key){
  if(!key) return null;
  return DATA.find(d=>buildItemKey(d)===key);
}
function findByCode(code, packageCode='', warehouse='', barcode=''){
  if(!code) return null;
  const matches=DATA.filter(d=>String(d.code||'').trim()===String(code).trim());
  if(!matches.length) return null;

  const pkg=String(packageCode||'').trim();
  const wh=String(warehouse||'').trim();
  const br=String(barcode||'').trim();
  const exact=matches.find(d =>
    (!pkg || String(d.package_code||'').trim()===pkg) &&
    (!wh || String(d.warehouse||'').trim()===wh) &&
    (!br || String(d.barcode||'').trim()===br)
  );
  if(exact) return exact;

  if(pkg){
    const pkgMatches=matches.filter(d=>{
      const itemPkg=String(d.package_code||'').trim();
      return itemPkg && itemPkg!=='-' && itemPkg.toLowerCase()!=='null' && itemPkg===pkg;
    });
    return pkgMatches.length===1 ? pkgMatches[0] : null;
  }

  const noPackageMatches=matches.filter(d=>{
    const itemPkg=String(d.package_code||'').trim();
    return !itemPkg || itemPkg==='-' || itemPkg.toLowerCase()==='null';
  });
  if(noPackageMatches.length===1) return noPackageMatches[0];
  return null;
}

function validateProductDuplication(p){
  const code=String(p.code||'').trim();
  const wh=String(p.warehouse||'').trim();
  if(!code || !wh) return null;
  const dup=DATA.find(d=>String(d.code||'').trim()===code && String(d.warehouse||'').trim()===wh && String(d.package_code||'').trim()!==String(p.package_code||'').trim());
  return dup ? `تنبيه: يوجد صنف آخر بنفس الكود (${code}) في نفس المستودع لكن برمز طرد مختلف` : null;
}

function run(){
  const q=curQ.toLowerCase().trim();
  filtered=DATA.filter(p=>{
    if(q){
      const s=[p.name,p.code,p.package_code,p.barcode].join(' ').toLowerCase();
      if(!s.includes(q)) return false;
    }
    if(curF==='w1') return p.warehouse==='مستودع 1';
    if(curF==='w2') return p.warehouse==='مستودع 2';
    if(curF==='w3') return p.warehouse==='مستودع 3';
    if(curF==='img') return hasImage(p);
    if(curF==='noimg') return !hasImage(p);
    if(curF==='b10') return p.qty_boxes>=10;
    if(curF==='an') return (p.package_code||'').toUpperCase().startsWith('AN');
    if(curF==='b') return /^B[-\s]/i.test(p.package_code||'');
    if(curF==='m') return /^M[-\s]/i.test(p.package_code||'');
    return true;
  });
  if(sortByBoxes) filtered.sort((a,b)=>b.qty_boxes-a.qty_boxes);
  page=0;
  document.getElementById('rc').innerHTML=`<strong>${esc(filtered.length.toLocaleString('ar-EG'))}</strong> صنف`;
  render();
  updateStats();
}

function render(){
  const end=(page+1)*PAGE;
  const slice=filtered.slice(0,end);
  if(!slice.length){
    document.getElementById('grid').innerHTML='<div class="empty"><div style="font-size:48px;margin-bottom:12px">🔍</div><p>لا توجد نتائج</p></div>';
    return;
  }
  let h='';
  for(const p of slice){
    const img=getImg(p);
    const hasImg=!!img;
    const wc=p.warehouse==='مستودع 1'?'w1b':p.warehouse==='مستودع 2'?'w2b':'w3b';
    const wl=p.warehouse==='مستودع 1'?'م1':p.warehouse==='مستودع 2'?'م2':'م3';
    const imgHtml=hasImg?`<img class="ci" src="${esc(img)}" loading="lazy" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:'' ;
    const noImg=`<div class="ni" style="${hasImg?'display:none':''}">📦</div>`;
    const pickerKey=encodeURIComponent(buildItemKey(p));
    const addImgBtn=hasImg?'':`<button class="addimg-btn" onclick="event.stopPropagation();openImgPicker('${esc(pickerKey)}')">📷 إضافة صورة</button>`;

    const bc=p.qty_boxes>=10?'var(--green)':p.qty_boxes>=1?'var(--yellow)':'var(--red)';
    const boxes=p.qty_boxes%1===0?p.qty_boxes:p.qty_boxes.toFixed(1);

    h+=`<div class="card${hasImg?' hi':''}" data-key="${esc(pickerKey)}">
      <div class="iw">${imgHtml}${noImg}${addImgBtn}<span class="wb ${wc}">${esc(wl)}</span></div>
      <div class="cb">
        ${p.package_code&&p.package_code!=='-'?`<span class="pkg">${esc(p.package_code)}</span>`:''}
        <div class="cn">${esc(p.name)}</div>
        <div class="qty-row">
          <div class="qty-box">
            <span class="qty-label">عدد الصناديق</span>
            <span class="qty-val" style="color:${bc}">${esc(boxes)}</span>
          </div>
          <div class="qty-box">
            <span class="qty-label">تعبئة الصندوق</span>
            <span class="qty-val" style="color:var(--blue)">${esc(p.box_fill)}<span class="qty-unit"> ق</span></span>
          </div>
          <div class="qty-box">
            <span class="qty-label">إجمالي القطع</span>
            <span class="qty-val" style="color:var(--muted);font-size:12px">${esc(p.qty_pcs.toLocaleString('ar-EG'))}</span>
          </div>
        </div>
      </div>
    </div>`;
  }
  if(end<filtered.length){
    h+=`<div class="lmw"><button class="lmb" onclick="more()">تحميل المزيد (${esc((filtered.length-end).toLocaleString('ar-EG'))} صنف)</button></div>`;
  }
  document.getElementById('grid').innerHTML=h;
}

function bindGridEvents(){
  document.getElementById('grid').addEventListener('click', e=>{
    const card=e.target.closest('.card[data-key]');
    if(!card) return;
    const p=findByKey(decodeURIComponent(card.dataset.key));
    if(p) opnM(p);
  });
}

function more(){page++;render();}

function opnM(p){
  curCode=p.code;
  curItemKey=buildItemKey(p);
  const img=getImg(p);
  const mi=document.getElementById('mi');
  if(img){mi.src=img;mi.style.display='block';}else{mi.style.display='none';}
  const delBtn=document.getElementById('delImgBtn');
  if(delBtn) delBtn.style.display = img ? 'inline-block' : 'none';
  document.getElementById('mc').textContent=String(p.package_code||p.code||'—');
  document.getElementById('mn').textContent=String(p.name||'—');

  const bc=p.qty_boxes>=10?'var(--green)':p.qty_boxes>=1?'var(--yellow)':'var(--red)';
  const boxes=p.qty_boxes%1===0?p.qty_boxes:p.qty_boxes.toFixed(1);

  document.getElementById('mq').innerHTML=`
    <div class="mqty-main">
      <div class="big" style="color:${bc}">${esc(boxes)}</div>
      <div class="unit">صندوق متوفر</div>
    </div>
    <div class="mqty-sub">
      <div class="num">${esc(p.box_fill)}</div>
      <div class="lbl">تعبئة الصندوق / قطعة</div>
    </div>
    <div class="mqty-sub">
      <div class="num">${esc(p.qty_pcs.toLocaleString('ar-EG'))}</div>
      <div class="lbl">إجمالي القطع</div>
    </div>`;

  document.getElementById('md').innerHTML=`
    <div class="mi2"><div class="ml">رمز الطرد</div><div class="mv">${esc(p.package_code||'—')}</div></div>
    <div class="mi2"><div class="ml">كود المادة</div><div class="mv" style="font-size:12px">${esc(p.code||'—')}</div></div>
    <div class="mi2 mfull"><div class="ml">باركود</div><div class="mv" style="font-size:12px;letter-spacing:1px">${esc(p.barcode||'—')}</div></div>
    <div class="mi2"><div class="ml">المستودع</div><div class="mv" style="font-size:13px">${esc(p.warehouse||'—')}</div></div>`;

  document.getElementById('ov').classList.add('on');
}

// ===== ضغط الصور تلقائياً (تصغير الأبعاد + تحويل لـ JPEG بجودة عالية) =====
// الهدف: نفس الوضوح تقريباً للعين، بس حجم أصغر بعشرات المرات من صورة موبايل خام.
function compressImage(blob, maxDim=1000, quality=0.85){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      canvas.toBlob(b=>{
        const r=new FileReader();
        r.onload=()=>resolve({dataUrl:r.result, blob:b});
        r.onerror=reject;
        r.readAsDataURL(b);
      },'image/jpeg',quality);
    };
    img.onerror=reject;
    img.src=url;
  });
}

// ===== إضافة صورة لصنف بدون صورة (زر على الكارت) — عبر لصق Ctrl+V أو اختيار ملف =====
let imgPickerCode=null;
function openImgPicker(key){
  imgPickerCode=decodeURIComponent(key||'');
  const p=findByKey(imgPickerCode);
  document.getElementById('imgModalTitle').textContent='إضافة صورة — '+(p?p.name:'');
  document.getElementById('dzInner').innerHTML='<div class="dzicon">📋</div><div class="dztxt">اضغط هون وبعدين <b>Ctrl+V</b><br>أو دوس لاختيار ملف من جهازك</div>';
  document.getElementById('ovImg').classList.add('on');
  document.getElementById('dropzone').focus();
}
function closeImgModal(){
  document.getElementById('ovImg').classList.remove('on');
  imgPickerCode=null;
}
async function applyPickedImage(blob){
  const {dataUrl, blob:compressedBlob}=await compressImage(blob);
  const p=findByKey(imgPickerCode);
  if(!p) return;
  try{
    const payload = { ...p, image_url: dataUrl };
    const saved = await saveProductToServer(payload);
    // update local record
    p.image_url = saved.image_url || dataUrl;
  }catch(err){
    console.warn('لم يتم حفظ الصورة على الخادم:', err);
  }
  run(); closeImgModal();
}
document.getElementById('cardImgInput').addEventListener('change', function(e){
  const file=e.target.files[0];
  if(!file || !imgPickerCode) return;
  applyPickedImage(file);
  e.target.value='';
});
// لصق من الحافظة (Ctrl+V) — يشتغل سواء كانت نافذة "إضافة صورة" مفتوحة، أو نموذج إضافة/تعديل صنف
document.addEventListener('paste', async function(e){
  const items=(e.clipboardData||window.clipboardData)?.items;
  if(!items) return;
  let imgItem=null;
  for(const it of items){ if(it.type && it.type.startsWith('image/')){ imgItem=it; break; } }
  if(!imgItem) return;
  const blob=imgItem.getAsFile();
  if(!blob) return;

  if(document.getElementById('ovImg').classList.contains('on') && imgPickerCode){
    e.preventDefault();
    await applyPickedImage(blob);
  } else if(document.getElementById('ov2').classList.contains('on')){
    e.preventDefault();
    const {dataUrl, blob:compressedBlob}=await compressImage(blob);
    formImageData=dataUrl;
    formImageBlob=compressedBlob;
    const prev=document.getElementById('f_preview');
    prev.src=dataUrl; prev.style.display='block';
  }
});

let formImageData='';
let formImageBlob=null; // الصورة المضغوطة الجديدة (لسا ما انكتبت كملف) - بتنكتب فعلياً وقت الحفظ بـ saveForm

  document.getElementById('f_boxfill').value=p.box_fill||1;

document.getElementById('f_image').addEventListener('change', async function(e){

});
function clsForm(){document.getElementById('ov2').classList.remove('on');}
async function saveProductToServer(product){
  const payload = { product: { ...product, image_url: String(product.image_url || '') } };
  const response = await fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!response.ok) throw new Error('فشل حفظ المنتج في قاعدة البيانات');
  return await response.json();
}
async function saveForm(){
  const name=document.getElementById('f_name').value.trim();
  const code=document.getElementById('f_code').value.trim();
  if(!name||!code){ alert('الاسم والكود مطلوبان'); return; }
  const qtyPcs=parseFloat(document.getElementById('f_qtypcs').value)||0;
  const boxFill=parseFloat(document.getElementById('f_boxfill').value)||1;
  const qtyBoxesInput=document.getElementById('f_qtyboxes').value;

  const existingItem=findByKey(curItemKey) || null;
  const obj={
    name,
    code,
    package_code: document.getElementById('f_package').value.trim()||'-',
    barcode: document.getElementById('f_barcode').value.trim(),
    qty_pcs: qtyPcs,
    box_fill: boxFill,
    qty_boxes: qtyBoxesInput!==''?parseFloat(qtyBoxesInput):+(qtyPcs/boxFill).toFixed(1),
    warehouse: document.getElementById('f_warehouse').value,
    image_url: existingItem ? existingItem.image_url || '' : ''
  };

    if(formImageData){
      // send compressed data-URL to server; server will save file and return stored image URL
      obj.image_url = formImageData;
    }

  const duplicateNote=validateProductDuplication(obj);
  if(duplicateNote) alert(duplicateNote);

  try{
    const saved=await saveProductToServer(obj);
    obj.image_url=saved.image_url || obj.image_url;
  }catch(err){
    console.warn('لم يتم حفظ المنتج في الخادم:', err);
  }

  const idx = existingItem ? DATA.findIndex(d=>buildItemKey(d)===curItemKey)
    : DATA.findIndex(d=>String(d.code||'')===String(code)
      && String(d.package_code||'')===String(obj.package_code)
      && String(d.warehouse||'')===String(obj.warehouse)
      && String(d.barcode||'')===String(obj.barcode));

  if(idx>-1) DATA[idx]=obj; else DATA.push(obj);
  curItemKey=buildItemKey(obj);
  formImageData='';
  formImageBlob=null;
  clsForm();
  run();
}

// ===== تصدير نسخة محدّثة كحزمة ZIP ذكية =====
async function exportUpdated(){
  if(typeof JSZip==='undefined'){
    alert('لم نتمكن من تحميل مكتبة الضغط، يرجى المحاولة لاحقاً.');
    return;
  }

  document.getElementById('grid').innerHTML='';
  const marker='/*__CATALOG_EXPORT_MARKER__*/';
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const exportProducts=DATA.map(p=>({...p}));

  const zip=new JSZip();
  const imagesFolder=zip.folder('images');
  for(const p of exportProducts){
    const url=String(p.image_url||'');
    if(url.startsWith('data:image/')){
      const m = url.match(/^data:(image\/[^;]+);base64,(.+)$/);
      if(m){
        const mime = m[1];
        const ext = (mime.split('/')[1]||'jpg').replace('jpeg','jpg');
        const fileName = `${safeImageNamePart(buildImageFileName(p))}.${ext}`;
        imagesFolder.file(fileName, m[2], {base64:true});
        p.image_url = `images/${fileName}`;
      } else {
        p.image_url='';
      }
    } else {
      // keep server-side image paths as-is (if present)
      p.image_url = url.startsWith('images/') ? url : '';
    }
  }

  const newProducts=`${marker}\nconst PRODUCTS=${JSON.stringify(exportProducts)};`;
  const re=/\/\*__CATALOG_EXPORT_MARKER__\*\/\s*const PRODUCTS=\[[\s\S]*?\];/;
  let updated=html.replace(re, newProducts);
  if(updated===html){
    updated=html.replace(/<script>\s*const PRODUCTS=\[/, `<script>\n${newProducts}\n`);
  }

  zip.file('index.html', updated);
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='al-nour-catalog-update.zip';
  document.body.appendChild(a);
  a.click();
  a.remove();
  run();
}

async function deleteCurrentImage(){
  const p=findByKey(curItemKey) || findByCode(curCode);
  if(!p){ return; }
  const path=p.image_url;
  if(!path){ alert('لا توجد صورة لهاد الصنف أساساً.'); return; }
  if(!confirm(`متأكد إنك بدك تحذف صورة الصنف "${p.name}"؟`)) return;
  // Clear image URL on product and persist to server
  p.image_url='';
  try{
    await saveProductToServer(p);
  }catch(err){
    console.warn('لم يتم حفظ حذف الصورة في الخادم:', err);
  }
  document.getElementById('mi').style.display='none';
  document.getElementById('delImgBtn').style.display='none';
  run();
}
